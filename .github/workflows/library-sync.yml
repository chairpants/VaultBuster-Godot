# Twice a day, takes episodes nobody can watch any more out of data/tapes.json,
# and puts back any that have returned. What's dead is decided elsewhere:
# VaultVision's own scheduled check asks archive.org and keeps the verdicts in
# library-health.json (nothing here talks to archive.org). Runs half an hour
# after that check. A run that changes nothing commits nothing.
# See tools/prune_tapes.mjs for exactly what it will and won't touch.
name: Library sync

on:
  schedule:
    - cron: "47 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the pruned tapes
  actions: write    # keep the schedule alive

concurrency:
  group: library-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # only the data and the tool: the world's models are large and not needed
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the library check's record
        run: curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/library-health.json" https://raw.githubusercontent.com/chairpants/VaultVision/master/library-health.json

      - name: Prune the tapes
        run: node tools/prune_tapes.mjs "$RUNNER_TEMP/library-health.json"

      - name: Commit if anything changed
        run: |
          git add data/tapes.json
          git add --all data/tapes-removed.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Library sync: prune dead episodes from the tapes"
          git push

      # GitHub switches a schedule off after 60 days with no repository
      # activity; re-enabling the workflow resets that clock.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/library-sync.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
